spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarthome}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8081}
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=3600000
app.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,http://localhost:4200,capacitor://localhost,ionic://localhost,http://localhost,https://localhost}
